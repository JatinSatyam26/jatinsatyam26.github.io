<style>
:root{--bg:#070A0E;--ink:#E8ECF1;--mut:#8B96A5;--acc:#E0763C;
--line:rgba(139,150,165,.16)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);min-height:100svh;display:flex;
align-items:center;justify-content:center;text-align:center;
font-family:"Space Mono",Consolas,monospace}
.frame{position:fixed;inset:10px;border:1px solid var(--line);pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;
border:0 solid rgba(139,150,165,.55)}
.frame::before{top:-1px;left:-1px;border-width:1.5px 0 0 1.5px}
.frame::after{bottom:-1px;right:-1px;border-width:0 1.5px 1.5px 0}
.top{position:fixed;top:10px;left:0;right:0;padding:8px 18px;font-size:11px;
letter-spacing:.14em;color:var(--mut);text-transform:uppercase;text-align:left}
h1{font-family:"Space Grotesk",Archivo,sans-serif;font-weight:700;
font-size:clamp(80px,20vw,220px);line-height:1;color:var(--acc);
letter-spacing:-.02em}
p{margin-top:14px;font-size:12px;letter-spacing:.14em;color:var(--mut);
text-transform:uppercase}
a{display:inline-block;margin-top:30px;padding:13px 20px;font-size:12px;
letter-spacing:.1em;text-decoration:none;color:#14100C;background:var(--acc);
border-radius:2px;font-weight:700}
</style>
</head>
<body>
<div class="frame"></div>
<div class="top">JSAT — GROUND STATION</div>
